name: Unzip to Root

on:
  push:
    paths:
      - 'nightly-patched.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and strip workflows
        run: |
          unzip -qo nightly-patched.zip
          
          # Remove the workflows from the extracted folder so Git doesn't try to commit them
          rm -rf nightly-patched/.github/workflows/
          
          cp -a nightly-patched/. .
          rm -rf nightly-patched

      - name: Commit & push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract yt-dlp nightly code"
            git push
       
          fi
