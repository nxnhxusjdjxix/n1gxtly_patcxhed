name: Unzip to Root

on:
  push:
    paths:
      - 'nightly-patched.zip'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -qo nightly-patched.zip

      - name: Move everything to repo root
        run: |
          cp -a nightly-patched/. .
          rm -rf nightly-patched

      - name: Commit & push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract contents of nightly-patched.zip to repo root"
            git push
          fi
