name: Unzip Workflow

on: [push]

jobs:
  unzip_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip nightly-patched.zip
        run: unzip -qo nightly-patched.zip

      # example of what you might want next:
      - name: List extracted files
        run: ls -la
